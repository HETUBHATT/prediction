<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — EduVista</title>

  <!-- EduVista Master Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       EDUVISTA MASTER UNIFIED STYLESHEET
       ========================================== */

    :root {
      --bg-cream: #f4f0e6;
      --card-white: #ffffff;
      --text-dark: #2b382d;
      --text-muted: #748378;
      --sage-primary: #33503b;
      --sage-dark: #223828;
      --sage-light: #e6ebe3;
      --gold-accent: #c6a664;
      --border-color: #e5e0d5;
      --input-bg: #faf8f4;
      --shadow-soft: rgba(34, 56, 40, 0.08);
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --warning-bg: #fef7e0;
      --warning-text: #b06000;
      --danger-bg: #fce8e6;
      --danger-text: #c53929;
      --toggle-bg: #ffffff;
      --toggle-icon: #1c2b20;
    }

    [data-theme="dark"] {
      --bg-cream: #141b16;
      --card-white: #1e2820;
      --text-dark: #e8ebe6;
      --text-muted: #9aa89c;
      --sage-primary: #4a7053;
      --sage-dark: #638c6d;
      --sage-light: #28362b;
      --gold-accent: #d4b465;
      --border-color: #2d3b2f;
      --input-bg: #18221a;
      --shadow-soft: rgba(0, 0, 0, 0.35);
      --warning-bg: #382c14;
      --warning-text: #f3b143;
      --toggle-bg: #2d3b2f;
      --toggle-icon: #d4b465;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg-cream);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0.5rem;
      position: relative;
    }

    .ambient-glow-1, .ambient-glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }
    .ambient-glow-1 {
      width: 280px;
      height: 280px;
      background: var(--gold-accent);
      top: -40px;
      left: -40px;
    }
    .ambient-glow-2 {
      width: 320px;
      height: 320px;
      background: var(--sage-primary);
      bottom: -60px;
      right: -60px;
    }

    .card {
      background: var(--card-white);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1rem 1.6rem 0.85rem 1.6rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px var(--shadow-soft);
      z-index: 1;
      position: relative;
    }

    .theme-switch-wrapper {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 10;
    }

    .theme-toggle-btn {
      background: var(--toggle-bg);
      border: 1px solid var(--border-color);
      color: var(--toggle-icon);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      box-shadow: 0 2px 8px var(--shadow-soft);
      outline: none;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.05);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 0.2rem;
    }

    .brand-logo-svg {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      flex-shrink: 0;
      display: block;
    }

    .brand-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.35rem;
      color: var(--sage-dark);
      letter-spacing: -0.2px;
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .search-row {
      display: flex;
      gap: 0.45rem;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 0.75rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      pointer-events: none;
      z-index: 2;
    }

    .form-control {
      width: 100%;
      padding: 0.42rem 0.75rem 0.42rem 2.1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-dark);
      font-size: 0.8rem;
      outline: none;
    }

    /* Make placeholder text hide completely when user clicks/focuses on field */
    .form-control::placeholder {
      color: var(--text-muted);
      opacity: 0.75;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .form-control:focus::placeholder {
      color: transparent;
      opacity: 0;
    }

    .form-control:focus {
      border-color: var(--sage-primary);
      background: var(--card-white);
      box-shadow: 0 0 0 2px rgba(51, 80, 59, 0.15);
    }

    .btn-submit {
      padding: 0.42rem 0.9rem;
      border: none;
      border-radius: 8px;
      background: var(--sage-primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert-box {
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 0.45rem;
      display: none;
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-text);
    }

    .alert-error {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-text);
    }

    .dashboard-view {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-height: 255px;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    .dashboard-view::-webkit-scrollbar {
      width: 4px;
    }

    .dashboard-view::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .numeric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.35rem;
    }

    .stat-card {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4rem 0.45rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.1rem;
    }

    .stat-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    .stat-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--sage-dark);
    }

    .risk-badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.12rem 0.3rem;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
    }

    .risk-low { background: var(--success-bg); color: var(--success-text); }
    .risk-moderate { background: var(--warning-bg); color: var(--warning-text); }
    .risk-high { background: var(--danger-bg); color: var(--danger-text); }

    .visual-panels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
    }

    .visual-card {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 125px;
    }

    .visual-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.3rem;
      margin-bottom: 0.4rem;
    }

    .visual-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--sage-dark);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .visual-pill {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .ring-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.2rem 0;
    }

    .ring-svg {
      width: 78px;
      height: 78px;
      transform: rotate(-90deg);
    }

    .ring-bg-circle {
      fill: none;
      stroke: var(--sage-light);
      stroke-width: 8;
    }

    .ring-val-circle {
      fill: none;
      stroke: var(--sage-primary);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transition: stroke-dashoffset 0.8s ease;
    }

    .ring-inner-text {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ring-percent {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--sage-dark);
      line-height: 1;
    }

    .ring-sub {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .progress-comparison-box {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      justify-content: center;
      height: 100%;
    }

    .metric-row {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .metric-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .metric-pct {
      font-weight: 700;
    }

    .track-outer {
      width: 100%;
      height: 9px;
      background: var(--sage-light);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
    }

    .track-fill-current {
      height: 100%;
      background: var(--gold-accent);
      border-radius: 10px;
      transition: width 0.8s ease;
    }

    .track-fill-predicted {
      height: 100%;
      background: var(--sage-primary);
      border-radius: 10px;
      transition: width 0.8s ease;
    }

    .empty-msg {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 2.8rem 0;
    }

    .app-footer {
      margin-top: 0.65rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      z-index: 1;
    }

    @media (max-width: 576px) {
      body {
        padding: 0.5rem;
      }
      .card {
        padding: 0.9rem 1rem 0.8rem 1rem;
        border-radius: 14px;
      }
      .theme-switch-wrapper {
        top: 0.75rem;
        right: 0.75rem;
      }
      .theme-toggle-btn {
        width: 30px;
        height: 30px;
        font-size: 0.78rem;
      }
      .brand-title {
        font-size: 1.2rem;
      }
      .card-title {
        font-size: 1rem;
      }
      .numeric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .visual-panels-grid {
        grid-template-columns: 1fr;
      }
      .dashboard-view {
        max-height: 230px;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="card">
    <div class="theme-switch-wrapper">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Night View">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
    </div>

    <div class="brand">
      <svg class="brand-logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="95" fill="#faf8f4" stroke="#5b6e58" stroke-width="4" />
        <circle cx="100" cy="100" r="90" fill="none" stroke="#bfa054" stroke-width="2" />
        <path d="M100 120 C75 105 45 110 30 115 L30 128 C45 123 75 118 100 135 C125 118 155 123 170 128 L170 115 C155 110 125 105 100 120 Z" fill="#243d2c" />
        <path d="M100 110 C80 97 50 101 35 105 L35 115 C50 111 80 107 100 122 C120 107 150 111 165 115 L165 105 C150 101 120 97 100 110 Z" fill="#d4b465" />
        <path d="M100 101 C83 90 55 93 40 96 L40 104 C55 101 83 98 100 111 C117 98 145 101 160 104 L160 96 C145 93 117 90 100 101 Z" fill="#e2cb91" />
        <rect x="88" y="80" width="10" height="24" rx="2" fill="#d4b465" />
        <rect x="103" y="72" width="10" height="32" rx="2" fill="#c4a148" />
        <rect x="118" y="60" width="10" height="44" rx="2" fill="#6c8866" />
        <rect x="133" y="48" width="10" height="56" rx="2" fill="#243d2c" />
        <polygon points="100,22 138,40 100,58 62,40" fill="#243d2c" />
        <polygon points="76,47 76,60 100,68 124,60 124,47" fill="#33503b" />
        <path d="M100 40 L125 50 L125 64" stroke="#d4b465" stroke-width="3" stroke-linecap="round" fill="none" />
        <circle cx="125" cy="66" r="3" fill="#d4b465" />
        <path d="M65 82 L77 72 L90 78 L112 58 L142 36" stroke="#243d2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <polygon points="138,32 147,32 144,41" fill="#243d2c" />
        <circle cx="77" cy="72" r="4" fill="#faf8f4" stroke="#243d2c" stroke-width="3" />
        <circle cx="90" cy="78" r="4" fill="#faf8f4" stroke="#243d2c" stroke-width="3" />
        <circle cx="112" cy="58" r="4" fill="#faf8f4" stroke="#243d2c" stroke-width="3" />
      </svg>
      <div class="brand-title">EduVista</div>
    </div>

    <h2 class="card-title">Student Dashboard</h2>

    <div id="alertBox" class="alert-box"></div>

    <!-- Search Form without static value -->
    <form id="studentAnalyticsForm" class="search-row">
      <div class="input-wrapper">
        <i class="fa-solid fa-id-badge input-icon"></i>
        <input type="number" id="studentId" class="form-control" placeholder="e.g. 1" required min="1">
      </div>
      <button type="submit" class="btn-submit" id="btnSubmit">
        <i class="fa-solid fa-chart-pie"></i> Load
      </button>
    </form>

    <div class="dashboard-view" id="dashboardContainer">
      <div class="empty-msg">Enter a Student ID and click "Load" to display dashboard.</div>
    </div>
  </div>

  <footer class="app-footer">
    &copy; 2026 EduVista Management System. All rights reserved.
  </footer>

  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeIcon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      localStorage.setItem('eduvista_theme', theme);
    }

    const savedTheme = localStorage.getItem('eduvista_theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerText = message;
      alertBox.className = `alert-box alert-${type}`;
      alertBox.style.display = 'block';
    }

    document.getElementById('studentAnalyticsForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const btnSubmit = document.getElementById('btnSubmit');
      alertBox.style.display = 'none';

      const studentId = Number(document.getElementById('studentId').value);
      if (!studentId || studentId <= 0) {
        showAlert('Please enter a valid Student ID.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';

      const endpoint = `http://127.0.0.1:4009/analytics/student/${studentId}`;

      try {
        const response = await fetch(endpoint, {
          method: 'GET',
          headers: {
            'accept': 'application/json'
          }
        });

        if (response.ok) {
          const data = await response.json();
          renderDashboard(data, studentId);
          showAlert(`Analytics loaded for Student #${studentId}!`, 'success');
        } else {
          const errorData = await response.json().catch(() => ({}));
          showAlert(`Error ${response.status}: ${errorData.detail || 'Failed to fetch analytics.'}`, 'error');
        }
      } catch (error) {
        const mockData = {
          student_id: studentId,
          name: "Name Middlename Surname",
          department: "BCA",
          attendance: 87.5,
          academics: 82.0,
          predicted: 88.5,
          risk_level: "Low"
        };
        renderDashboard(mockData, studentId);
        showAlert(`Analytics loaded (Local Mode)!`, 'success');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fa-solid fa-chart-pie"></i> Load';
      }
    });

    function renderDashboard(data, id) {
      const container = document.getElementById('dashboardContainer');
      const att = Math.min(100, Math.max(0, Number(data.attendance || 87.5)));
      const score = Math.min(100, Math.max(0, Number(data.academics || data.internal_score || data.average_score || 82.0)));
      const predicted = Math.min(100, Math.max(0, Number(data.predicted || data.predicted_performance || 88.5)));
      const risk = (data.risk_level || 'Low').toUpperCase();

      let badgeClass = 'risk-low';
      if (risk.includes('MODERATE') || risk.includes('MEDIUM')) badgeClass = 'risk-moderate';
      if (risk.includes('HIGH')) badgeClass = 'risk-high';

      const circumference = 220;
      const offset = circumference - (att / 100) * circumference;

      container.innerHTML = `
        <div class="numeric-grid">
          <div class="stat-card">
            <span class="stat-label">Attendance</span>
            <span class="stat-val">${att}%</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Academics</span>
            <span class="stat-val">${score}%</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Predicted</span>
            <span class="stat-val" style="color: var(--gold-accent);">${predicted}%</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Risk Mode</span>
            <span class="risk-badge ${badgeClass}">${risk}</span>
          </div>
        </div>

        <div class="visual-panels-grid">
          <div class="visual-card">
            <div class="visual-header">
              <span class="visual-title">Attendance Ratio</span>
              <span class="visual-pill">Target: 75%</span>
            </div>
            <div class="ring-wrapper">
              <svg class="ring-svg" viewBox="0 0 80 80">
                <circle class="ring-bg-circle" cx="40" cy="40" r="35"></circle>
                <circle id="attendanceRingCircle" class="ring-val-circle" cx="40" cy="40" r="35" style="stroke-dashoffset: ${offset};"></circle>
              </svg>
              <div class="ring-inner-text">
                <span class="ring-percent">${att}%</span>
                <span class="ring-sub">Present</span>
              </div>
            </div>
          </div>

          <div class="visual-card">
            <div class="visual-header">
              <span class="visual-title">Score Comparison</span>
              <span class="visual-pill">Scale: 0-100</span>
            </div>
            <div class="progress-comparison-box">
              <div class="metric-row">
                <div class="metric-label-row">
                  <span>Current Score</span>
                  <span class="metric-pct" style="color: var(--gold-accent);">${score}%</span>
                </div>
                <div class="track-outer">
                  <div class="track-fill-current" style="width: ${score}%;"></div>
                </div>
              </div>

              <div class="metric-row">
                <div class="metric-label-row">
                  <span>Predicted Outcome</span>
                  <span class="metric-pct" style="color: var(--sage-primary);">${predicted}%</span>
                </div>
                <div class="track-outer">
                  <div class="track-fill-predicted" style="width: ${predicted}%;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
